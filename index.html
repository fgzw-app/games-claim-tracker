<script>
    const API_URL = 'https://www.gamerpower.com/api/filter?platform=epic-games-store+steam&type=game';
    let allGames = [];
    let currentFilter = 'all';

    // 1. Register Service Worker for Mobile Notifications
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered Successfully'))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }

    // 2. Fetch free games from the API
    async function fetchFreeGames(isManual = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        allGames = Array.isArray(data) ? data : [];

        renderGames();
        checkForNewGiveaways(allGames);
      } catch (err) {
        console.error("Failed to load games:", err);
        document.getElementById('gamesList').innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-amber-500"></i>
            <p>Could not load games. Please try again later.</p>
          </div>`;
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    // 3. Render Game Cards
    function renderGames() {
      const container = document.getElementById('gamesList');
      const filtered = allGames.filter(game => {
        const plat = (game.platforms || '').toLowerCase();
        if (currentFilter === 'epic') return plat.includes('epic');
        if (currentFilter === 'steam') return plat.includes('steam');
        return true;
      });

      document.getElementById('gameCount').textContent = `${filtered.length} free game${filtered.length === 1 ? '' : 's'} available`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500">No active free games found for this platform.</div>`;
        return;
      }

      container.innerHTML = filtered.map(game => {
        const isEpic = (game.platforms || '').toLowerCase().includes('epic');
        const badgeColor = isEpic ? 'bg-slate-800 text-slate-200 border-slate-700' : 'bg-blue-950 text-blue-300 border-blue-800';
        const badgeIcon = isEpic ? 'fa-brands fa-neos' : 'fa-brands fa-steam';
        const badgeName = isEpic ? 'Epic Games' : 'Steam';

        return `
          <article class="bg-slate-900 rounded-2xl border border-slate-800/80 overflow-hidden shadow-lg">
            <div class="relative">
              <img src="${game.thumbnail || game.image}" alt="${game.title}" class="w-full h-44 object-cover" loading="lazy" />
              <div class="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-full text-xs font-semibold border flex items-center gap-1.5 shadow-md ${badgeColor}">
                <i class="${badgeIcon}"></i> ${badgeName}
              </div>
              <div class="absolute top-2.5 right-2.5 px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-500 text-slate-950 shadow-md">
                FREE <span class="line-through opacity-70 ml-0.5">${game.worth || ''}</span>
              </div>
            </div>

            <div class="p-4">
              <h2 class="font-bold text-base text-white line-clamp-1">${game.title}</h2>
              <p class="text-xs text-slate-400 mt-1 line-clamp-2 leading-relaxed">${game.description || 'Limited time giveaway.'}</p>
              
              <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                <span class="text-[11px] text-slate-500">
                  <i class="fa-regular fa-clock mr-1"></i>${game.end_date !== 'N/A' ? 'Limited time' : 'Claim now'}
                </span>
                <a href="${game.open_giveaway_url}" target="_blank" rel="noopener noreferrer" 
                   class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-md transition">
                  Claim Game <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // 4. Platform Filter
    function filterPlatform(platform) {
      currentFilter = platform;
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.className = 'filter-tab flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition';
      });
      document.getElementById(`tab-${platform}`).className = 'filter-tab flex-1 py-2 rounded-lg bg-indigo-600 text-white font-semibold transition';
      renderGames();
    }

    // 5. Universal Notification Dispatcher (Mobile Service Worker + Desktop Fallback)
    async function sendMobileNotification(title, body, iconUrl) {
      const options = {
        body: body,
        icon: iconUrl || "https://cdn-icons-png.flaticon.com/512/686/686589.png",
        badge: "https://cdn-icons-png.flaticon.com/512/686/686589.png",
        vibrate: [200, 100, 200]
      };

      if ('serviceWorker' in navigator) {
        const registration = await navigator.serviceWorker.ready;
        registration.showNotification(title, options);
      } else if ('Notification' in window) {
        new Notification(title, options);
      }
    }

    // 6. Notification Permission Handler
    async function toggleNotifications() {
      if (!("Notification" in window)) {
        alert("This browser does not support notifications.");
        return;
      }

      const permission = await Notification.requestPermission();
      updateNotificationBtn();
      if (permission === "granted") {
        sendMobileNotification("Alerts Enabled!", "You'll be notified when new free games drop.");
      }
    }

    function updateNotificationBtn() {
      const statusText = document.getElementById('notifyStatus');
      const icon = document.getElementById('bellIcon');
      if (window.Notification && Notification.permission === "granted") {
        statusText.textContent = "Alerts On";
        icon.className = "fa-solid fa-bell text-emerald-400";
      } else {
        statusText.textContent = "Enable Alerts";
        icon.className = "fa-regular fa-bell";
      }
    }

    // 7. Test Alert Trigger
    async function triggerTestNotification() {
      if (!("Notification" in window)) {
        alert("Notifications are not supported on this browser.");
        return;
      }

      let perm = Notification.permission;
      if (perm !== "granted") {
        perm = await Notification.requestPermission();
        updateNotificationBtn();
      }

      if (perm !== "granted") {
        alert("Notification permission denied. Please allow notifications in site settings.");
        return;
      }

      alert("Notification scheduled for 3 seconds! Minimize Chrome or lock your screen now to see the banner.");

      setTimeout(() => {
        sendMobileNotification(
          "🎮 Free Game Alert (Test)",
          "Death Stranding is 100% off on Epic Games Store! Tap to claim."
        );
      }, 3000);
    }

    // 8. Auto-check for newly released giveaways
    function checkForNewGiveaways(games) {
      const knownIds = JSON.parse(localStorage.getItem('known_giveaway_ids') || '[]');
      const currentIds = games.map(g => String(g.id));

      if (knownIds.length > 0 && window.Notification && Notification.permission === "granted") {
        const newDrops = games.filter(g => !knownIds.includes(String(g.id)));
        newDrops.forEach(game => {
          sendMobileNotification(
            `Free Game: ${game.title}`,
            `Free on ${game.platforms}. Tap to claim!`,
            game.thumbnail
          );
        });
      }

      localStorage.setItem('known_giveaway_ids', JSON.stringify(currentIds));
    }

    // Initial Execution
    updateNotificationBtn();
    fetchFreeGames();
    setInterval(() => fetchFreeGames(), 15 * 60 * 1000);
  </script>
